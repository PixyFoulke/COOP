
<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<title>
Door Control
</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<header>

<h1>
Coop Door Control
</h1>


<nav class="navbar">

<a href="index.html">
Home
</a>

<a href="video.html">
Live Video
</a>

<a href="door.html">
Door
</a>

<a href="data.html">
COOP Data
</a>

<a href="environment.html?v=2">
Environment
</a>

<a href="settings.html">
Settings
</a>

</nav>


</header>



<div class="dashboard">


<div class="card">

<h3>
Door Status
</h3>

<p id="doorStatus" class="value">
Closed
</p>

</div>



<div class="card">

<h3>
Manual Control
</h3>

<button onclick="openDoor()">
OPEN DOOR
</button>

<button onclick="closeDoor()">
CLOSE DOOR
</button>

</div>



<div class="card">

<h3>
Door Schedule
</h3>


<label for="scheduleMode">
Schedule Mode
</label>

<br><br>


<select
id="scheduleMode"
onchange="updateScheduleDisplay()">

<option value="sunrise_sunset">
Sunrise / Sunset
</option>

<option value="manual">
Manual Times
</option>

</select>



<div id="sunSchedule">

<p>
Door opens at sunrise
</p>

<p>
Door closes at sunset
</p>

</div>



<div id="manualSchedule">

<br>

<label for="openTime">
Open Time
</label>

<input
type="time"
id="openTime">

<br><br>


<label for="closeTime">
Close Time
</label>

<input
type="time"
id="closeTime">

</div>


<br>


<button onclick="saveSchedule()">
Save Schedule
</button>


<p id="scheduleStatus">
Loading schedule...
</p>

</div>


</div>


<script src="js/door.js?v=3"></script>


</body>

</html>
