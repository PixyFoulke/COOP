
<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>COOP Safety Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>


<header>

    <h1>🐔 COOP Safety System</h1>

    <p>Chicken Optics for Overall Protection</p>

    <a href="settings.html" class="nav-button">
        ⚙ Settings
    </a>

</header>



<div class="dashboard">


    <!-- STATUS -->
    <div class="card status-card">
        <h3>System Status</h3>
        <p id="status" class="value">Loading...</p>
    </div>


    <!-- LIGHT -->
    <div class="card">
        <h3>Lighting</h3>
        <p id="light" class="value">--</p>
    </div>


    <!-- TEMPERATURE -->
    <div class="card">
        <h3>🌡 Temperature</h3>
        <p id="temperature" class="value">-- °F</p>
    </div>


    <!-- HUMIDITY -->
    <div class="card">
        <h3>💧 Humidity</h3>
        <p id="humidity" class="value">-- %</p>
    </div>


    <!-- CHICKENS -->
    <div class="card">
        <h3>🐔 Chickens</h3>
        <p id="chickens" class="value">--</p>
    </div>


    <!-- THREATS -->
    <div class="card">
        <h3>🚨 Threats</h3>
        <p id="threats">None</p>
    </div>


    <!-- UNKNOWN -->
    <div class="card">
        <h3>❓ Unknown Objects</h3>
        <p id="unknowns">None</p>
    </div>


</div>



<!-- CAMERA -->
<div class="camera-section">

    <h2>📷 Live Camera Feed</h2>

    <img 
    src="http://192.168.50.2:5000/video_feed"
    id="video">

</div>



<script src="script.js"></script>


</body>

</html>
